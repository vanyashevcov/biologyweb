[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://sites.google.com https://*.googleusercontent.com"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
